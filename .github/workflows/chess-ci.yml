name: Chess trainer CI

on:
  pull_request:
    paths:
      - 'chess/**'
      - '.github/workflows/chess-ci.yml'

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: chess
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: chess/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build
